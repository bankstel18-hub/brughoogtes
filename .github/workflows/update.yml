# Haalt elke 10 minuten de waterstanden en verwachtingen op (bruggen en sluizen eens per dag)
# en zet de app met de nieuwe data op GitHub Pages.
# Elke run plant zelf de volgende in (job 'volgende'), omdat GitHub geplande runs onregelmatig start.
# De 'schedule' hieronder blijft als vangnet staan.
name: Data bijwerken en publiceren

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bruggen:
        description: "Bruggen en sluizen nu opnieuw ophalen"
        type: boolean
        default: false
      zoek:
        description: "Brug opzoeken in het logboek (deel van naam of plaats)"
        type: string
        default: ""
      inspect:
        description: "Onderhoud: FIS-lagen inspecteren (laagnummers, komma-gescheiden)"
        type: string
        default: ""

permissions:
  contents: write   # alleen voor de maandelijkse 'keepalive'-commit
  pages: write
  id-token: write
  actions: write    # om de volgende run in te plannen

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App klaarzetten en vorige data ophalen
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p _site/data
          cp -r public/. _site/
          for f in bridges locks network stations forecast water status hist fc10 astro lags debug-bridges debug-locks debug-water debug-forecast; do
            curl -sfL --max-time 60 "$SITE/data/$f.json" -o "_site/data/$f.json" || rm -f "_site/data/$f.json"
          done
          ls -la _site/data
          echo "live water.json generatedAt: $(node -e 'try{console.log(require("./_site/data/water.json").generatedAt)}catch(e){console.log("geen")}')"
          echo "live water.json via curl headers:"; curl -sI --max-time 30 "$SITE/data/water.json" | grep -iE "^(last-modified|cache-control|age|date):" || true

      - name: FIS-lagen inspecteren
        if: inputs.inspect != ''
        env:
          INSPECT: ${{ inputs.inspect }}
        run: node scripts/inspect.mjs

      - name: Data bijwerken bij Rijkswaterstaat
        env:
          ZOEK: ${{ inputs.zoek }}
        run: node scripts/update.mjs _site/data ${{ inputs.force_bruggen && '--force-bruggen' || '' }}

      - name: Tijdelijke bestanden opruimen
        if: always()
        run: rm -f _site/data/bridgejob.json _site/data/bj__*.json _site/data/lockjob.json _site/data/lj__*.json _site/data/netjob.json _site/data/nj__*.json

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site

      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4

      # GitHub zet geplande workflows uit na 60 dagen zonder activiteit in de repository.
      # Daarom eens per maand een lege commit.
      - name: Repository actief houden
        if: github.event_name != 'push'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "brughoogtes-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Repository actief houden (automatisch)"
            git push
          fi

  # Plant de volgende update over ~10 minuten in. Slaat over als er al een andere run loopt of wacht,
  # zodat er altijd maar één keten actief is.
  volgende:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wachten en volgende update starten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          sleep 540
          active=$(gh api "repos/$REPO/actions/workflows/update.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\") and .id != $SELF)] | length")
          echo "andere actieve runs: $active"
          if [ "$active" = "0" ]; then
            for i in 1 2 3 4 5; do
              if gh api -X POST "repos/$REPO/actions/workflows/update.yml/dispatches" -f ref=main; then
                echo "volgende update gestart"; exit 0
              fi
              echo "starten mislukt (poging $i), opnieuw over 20 s"; sleep 20
            done
            exit 1
          fi
