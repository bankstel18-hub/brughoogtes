# Haalt elke 10 minuten de waterstanden en verwachtingen op (bruggen en sluizen eens per dag)
# en zet de app met de nieuwe data op GitHub Pages.
# GitHub start geplande runs niet altijd op tijd (vaak 10 tot 30 minuten later). De app toont dan een
# waarschuwing en gebruikt voor "nu" de verwachting van Rijkswaterstaat als de meting ouder is dan 30 minuten.
# Vóór publicatie: tests (app-code) en datacontrole (nieuwe data tegen de vorige versie).
name: Data bijwerken en publiceren

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bruggen:
        description: "Bruggen en sluizen nu opnieuw ophalen"
        type: boolean
        default: false
      zoek:
        description: "Brug opzoeken in het logboek (deel van naam of plaats)"
        type: string
        default: ""
      inspect:
        description: "Onderhoud: FIS-lagen inspecteren (laagnummers, komma-gescheiden)"
        type: string
        default: ""

permissions:
  contents: write   # alleen voor de maandelijkse 'keepalive'-commit
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rekenregels en routeplanner testen. Mislukt dit, dan wordt de app niet gepubliceerd.
      - name: Tests
        id: tests
        run: npm test

      - name: App klaarzetten en vorige data ophalen
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p _site/data
          cp -r public/. _site/
          for f in bridges locks network route-net stations peil forecast water status hist fc10 astro lags check debug-bridges debug-locks debug-water debug-forecast; do
            curl -sfL --max-time 60 "$SITE/data/$f.json" -o "_site/data/$f.json" || rm -f "_site/data/$f.json"
          done
          ls -la _site/data
          cp -r _site/data _prev      # vorige versie, voor de datacontrole
          echo "live water.json generatedAt: $(node -e 'try{console.log(require("./_site/data/water.json").generatedAt)}catch(e){console.log("geen")}')"
          echo "live water.json via curl headers:"; curl -sI --max-time 30 "$SITE/data/water.json" | grep -iE "^(last-modified|cache-control|age|date):" || true

      - name: FIS-lagen inspecteren
        if: inputs.inspect != ''
        env:
          INSPECT: ${{ inputs.inspect }}
        run: node scripts/inspect.mjs

      - name: Data bijwerken bij Rijkswaterstaat
        env:
          ZOEK: ${{ inputs.zoek }}
        run: node scripts/update.mjs _site/data ${{ inputs.force_bruggen && '--force-bruggen' || '' }}

      # Nieuwe data vergelijken met de vorige versie en de testset bekende bruggen (tests/bekende-bruggen.json).
      # Afgekeurd: vorige versie blijft staan, de run wordt rood en GitHub stuurt een e-mail.
      - name: Datacontrole
        id: check
        if: always() && steps.tests.outcome == 'success'
        run: node scripts/check.mjs _site/data _prev

      - name: Tijdelijke bestanden opruimen
        if: always()
        run: rm -f _site/data/bridgejob.json _site/data/bj__*.json _site/data/lockjob.json _site/data/lj__*.json _site/data/netjob.json _site/data/nj__*.json

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.tests.outcome == 'success'
        with:
          path: _site

      - id: deploy
        if: always() && steps.tests.outcome == 'success'
        uses: actions/deploy-pages@v4

      # GitHub zet geplande workflows uit na 60 dagen zonder activiteit in de repository.
      # Daarom eens per maand een lege commit.
      - name: Repository actief houden
        if: github.event_name != 'push'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "brughoogtes-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Repository actief houden (automatisch)"
            git push
          fi
